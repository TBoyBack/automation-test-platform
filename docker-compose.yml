version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: test_platform_db
    environment:
      POSTGRES_DB: test_platform
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存/队列
  redis:
    image: redis:7-alpine
    container_name: test_platform_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO 对象存储 (视频/截图)
  minio:
    image: minio/minio:latest
    container_name: test_platform_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # API 服务
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: test_platform_api
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://testuser:testpass123@postgres:5432/test_platform
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock

  # 执行引擎 (可水平扩展)
  executor:
    build:
      context: .
      dockerfile: docker/Dockerfile.executor
    container_name: test_platform_executor
    ports:
      - "4723:4723"  # Appium 默认端口
    environment:
      APPIUM_HOST: http://localhost:4723
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - /dev/bus/usb:/dev/bus/usb
      - /opt/android-sdk:/opt/android-sdk
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm

  # Web 前端 (开发模式使用 vite)
  # 前端构建后由 Nginx 服务
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: test_platform_web
    ports:
      - "3000:80"
    depends_on:
      - api
    volumes:
      - ./src/web:/app

  # Playwright 浏览器集群
  browsers:
    image: mcr.microsoft.com/playwright:v1.40.0
    container_name: test_platform_browsers
    ports:
      - "9222:9222"
    environment:
      PLAYWRIGHT_CHROMIUM_PORT: 9222
    volumes:
      - ./storage:/app/storage

volumes:
  postgres_data:
  redis_data:
  minio_data:
